name: Extraer NOTAM DINACIA - prueba

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pymupdf
      - name: Extraer candidatos de NOTAM
        run: python actualizar_notam.py
      - name: Guardar JSON para revision
        uses: actions/upload-artifact@v4
        with:
          name: notam-extraccion-prueba
          path: notam.json
          retention-days: 7
