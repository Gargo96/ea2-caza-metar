name: Probar descarga NOTAM DINACIA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pymupdf
      - name: Probar PIB de DINACIA
        run: python probar_notam.py
      - name: Guardar resultado de prueba
        uses: actions/upload-artifact@v4
        with:
          name: notam-prueba
          path: notam_prueba.json
